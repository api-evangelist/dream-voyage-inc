name: Dream Voyage Inc.
description: >-
  Dream Voyage Inc. is an AI-driven consumer studio founded in 2023 and backed by
  Andreessen Horowitz through its Speedrun accelerator alongside Soma Capital. Led by
  co-founder and CEO Coco Chen, a former TikTok founding product manager and Tinder PM,
  the studio builds viral AI-powered consumer applications spanning spiritual wellness,
  dream interpretation, gaming, and social payments. Its products include SINE Daily
  Manifest (an AI spiritual-health app offering daily affirmations, astrology, birth-chart
  analysis, and tarot readings that went viral on TikTok), Dreamore (AI-powered dream
  interpretation), Vdrop (turning social media into a payment network), and RPS (a
  Solana-based social game). Dream Voyage ships consumer mobile apps rather than a public
  developer platform; as of this profile it publishes no developer portal, OpenAPI, SDKs,
  or documented API surface. This record is a network stub retained for discovery and
  future enrichment.
